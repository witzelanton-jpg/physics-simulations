<!DOCTYPE html>
<!--
    ============================================================
    Farb- und Formentest
    ============================================================
    Übungsseite für HTML, CSS und JavaScript.

    Was die Seite kann:
      - Farbe der Form über einen Farbwähler ändern
      - Form wählen: Kreis, Quadrat oder Dreieck
      - Form mit der Maus festhalten und verschieben (Drag & Drop)

    Aufbau der Datei:
      1. <head>   -> Infos über die Seite + CSS im <style>-Block (Aussehen)
      2. <body>   -> alles, was man sieht (Text, Eingabefelder, Form)
      3. <script> -> JavaScript (was passiert, wenn man etwas tut)
    ============================================================
-->
<html lang="de">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* ---------- Seite insgesamt ---------- */
        body {
            background: linear-gradient(to bottom left, lightyellow, lightgreen);
        }

        /* ---------- Die verschiebbare Form ---------- */
        .form {
            width: 100px;
            height: 100px;
            background-color: blueviolet;   /* Startfarbe, wird per JavaScript überschrieben */
            position: absolute;             /* frei platzierbar über left/top */
            left: 300px;                    /* Abstand vom linken Rand */
            top: 300px;                     /* Abstand vom oberen Rand */
            cursor: grab;                   /* Mauszeiger wird über der Form zur Hand */

        }

        /* ---------- Formen ---------- */
        /* Für "square" gibt es keine Regel: ein div ist von sich aus ein Quadrat. */
        .circle {
            border-radius: 50%;             /* Ecken maximal abrunden -> Kreis */
        }
        .triangle {
            /* Zuschneiden entlang von 3 Punkten (x% y%, gemessen von oben links):
               oben Mitte, unten links, unten rechts -> Dreieck */
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            }

        /* ---------- Karte: der farbige Kasten um den Inhalt ---------- */
        .karte {
            background-color: rgb(227, 166, 109);   /* rgb(rot, grün, blau), je 0-255 */
            max-width: 600px;               /* höchstens 600px breit */
            padding: 20px;                  /* Innenabstand: Rand -> Inhalt */
            margin: 20px;                   /* Außenabstand: Seite -> Karte */
            border-radius: 10px;            /* abgerundete Ecken */
        }

        /* ---------- Ausgewälte Form ---------- */
        .aktiv {
            outline: 2pt dashed black;
        }
        


    </style>

</head>

<body>
<!-- Karte: alles Sichtbare liegt in diesem Kasten (Aussehen siehe .karte im CSS) -->
<div class="karte">

    <h1> Farb- und Formentest</h1>

    <p>Dies ist mein zweiter HTML-Test. Hier möchte ich mit Farben und Formen probieren.
        Mal sehen, ob die interaktiv gestalltet werden können.
    </p>

    <!-- Farbwähler: über die id "color-input" findet JavaScript ihn wieder -->
    <p>Hier ist ein Eingabefeld für die Farbe:</p>
    <input type="color" id="color-input" value="blueviolet">

    <!-- Auswahlliste für die Form: der "value" jeder Option ist gleichzeitig
         der Name der CSS-Klasse, die JavaScript an die Form hängt -->
    <p>Hier ist ein Eingabefeld für die Form:</p>
    <select id="shape-select">
        <option value="square">Quadrat</option>
        <option value="circle">Kreis</option>
        <option value="triangle">Dreieck</option>
    </select>

    <button id="duplizieren">Form duplizieren</button>
    <button id="loeschen">Form löschen</button>

    <!-- Die Form selbst: ein leeres div, das erst durch CSS sichtbar wird -->
    <div class="form"></div>
    </div>
    <!-- Ende der Karte -->


<script>

    // ============================================================
    // 1. Elemente aus dem HTML holen (über ihre id)
    // ============================================================
    const colorInput = document.getElementById("color-input");
    const shapeSelect = document.getElementById("shape-select");
    const form = document.querySelector(".form");
    let ausgewaehlt = null;   // null = noch keine Form ausgewählt

    // ============================================================
    // 2. Farbe und Form ändern
    // ============================================================

    // Färbt die Form in der Farbe aus dem Farbwähler.
    // CSS "background-color" heißt in JavaScript "backgroundColor".
    function updateColor() {
        if (ausgewaehlt === null) {
            return;
        }

        ausgewaehlt.style.backgroundColor = colorInput.value;
    }

    // Setzt die gewählte Form ("circle", "square" oder "triangle") als CSS-Klasse.
    function updateShape() {
        if (ausgewaehlt === null) {
            return;
        }

        const selectedShape = shapeSelect.value;
        ausgewaehlt.classList.remove("circle", "square", "triangle");
        ausgewaehlt.classList.add(selectedShape);
    }
   

    // ============================================================
    // 3. Form auswählen & verschieben (Drag & Drop) & abwählen
    // ============================================================

    function auswaehlen(element) {
        // alte Auswahl entfernen
        if (ausgewaehlt !== null) {
            ausgewaehlt.classList.remove("aktiv");
        }
        // neue Form auswählen
        element.classList.add("aktiv");
        ausgewaehlt = element;
    }


    function machBeweglich(element) {
    let ziehen = false;   // Merkzettel: halte ich die Form gerade fest?

    // 1. Maustaste drücken -> festhalten
    element.addEventListener("pointerdown", function (event) {
        ziehen = true;
        auswaehlen(element);   // Form auswählen, wenn sie festgehalten wird
        element.setPointerCapture(event.pointerId);
    });

    // 2. Maus bewegen -> Form mitnehmen, aber nur wenn festgehalten
    element.addEventListener("pointermove", function (event) {
        if (ziehen === true) {
            element.style.left = (event.clientX - element.offsetWidth / 2) + "px";
            element.style.top = (event.clientY - element.offsetHeight / 2) + "px";
        }
    });

    // 3. Maustaste loslassen -> nicht mehr festhalten
    element.addEventListener("pointerup", function (event) {
        ziehen = false;
    });

    }

    function abwaehlen() {
        if (ausgewaehlt !== null) {
            ausgewaehlt.classList.remove("aktiv");
            ausgewaehlt = null;
        }
    }


    // ============================================================
    // 4. Formen dupliziern & löschen
    // ============================================================

    function duplizieren() {
        if (ausgewaehlt === null) {
            return;
        }

        const kopie = ausgewaehlt.cloneNode(); // kopieren der Form

        // etwas versetzt einsetzen
        kopie.style.left = (ausgewaehlt.offsetLeft + 20) + "px";
        kopie.style.top = (ausgewaehlt.offsetTop + 20) + "px";

        // kopie auf die Seite setzen
        ausgewaehlt.parentElement.appendChild(kopie);

        // beweglich machen
        machBeweglich(kopie);

        // kopie auswählen
        auswaehlen(kopie);

    }

    function loeschen() {
        if (ausgewaehlt === null) {
            return;
        }
        ausgewaehlt.remove();
        ausgewaehlt = null;
    }


    // ============================================================
    // 5. Eingabefelder mit den Funktionen verbinden
    // ============================================================
    // "input" = bei jeder Änderung im Feld wird die Funktion ausgeführt
    colorInput.addEventListener("input", updateColor);
    shapeSelect.addEventListener("input", updateShape);

    machBeweglich(form);   // Form beweglich machen
    auswaehlen(form);      // Form auswählen

    duplizierenKnopf = document.getElementById("duplizieren");
    loeschenKnopf = document.getElementById("loeschen");

    duplizierenKnopf.addEventListener("click", duplizieren);
    loeschenKnopf.addEventListener("click", loeschen);

    document.addEventListener("pointerdown", function (event) {
        if (event.target.closest(".form, button, input, select")) {
            return;
        }
        abwaehlen();
    });


</script>


</body>
</html>
