<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hallo Welt!</h1>
    <p>Dies ist ein einfacher HTML-Test.</p>

    <!-- 1. Eingabefeld für x -->
    <label for "x-eingabe">x=  </label>
    <input type="number" id="x-eingabe" value = "2" step = "0.5"> 

    <p> y= a* x = <span id="output"></span></p>
    <p>z = cos(x) = <span id="output-z"></span></p>

    <script>
    const a = 2;

    // Elemente einmal "holen" und in Variablen speichern
    const xEingabe = document.getElementById("x-eingabe");
    const output = document.getElementById("output");   
    const outputZ = document.getElementById("output-z");
    
    function berechne() {
        // Wert auslesen
        let x = Number(xEingabe.value);
        let y = x * a;
        let z = Math.cos(x);

        output.textContent = y;
        outputZ.textContent = z.toFixed(3);   // 3 Nachkommastellen
    }

    // Dei jeder Eingabe neu berechnen
    xEingabe.addEventListener("change", berechne);

    berechne();   // einmal direkt beim LAden ausführen

</script>
</body>   
</html>
